name: Sandbox candidate UI5 handoff

on:
  pull_request:
    branches:
      - sandbox/order-splitter-strategy-base-ui5

concurrency:
  group: sandbox-candidate-ui5-handoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  handoff:
    name: Verify UI5 candidate run and expose ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact-head sandbox candidate UI5 validation
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --commit "$HEAD_SHA" \
              --event push \
              --limit 20 \
              --json databaseId,status,conclusion,headSha,name)"
            row="$(printf '%s' "$runs" | jq -c --arg sha "$HEAD_SHA" '
              map(select(.headSha == $sha and .name == "Sandbox strategy candidate UI5")) | first // empty
            ')"
            if test -n "$row"; then
              run_id="$(printf '%s' "$row" | jq -r '.databaseId')"
              status="$(printf '%s' "$row" | jq -r '.status')"
              conclusion="$(printf '%s' "$row" | jq -r '.conclusion // ""')"
              echo "candidate UI5 run=$run_id status=$status conclusion=$conclusion"
              if test "$status" = completed; then
                test "$conclusion" = success
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "candidate UI5 push run not visible yet for $HEAD_SHA"
            fi
            sleep 20
          done
          echo 'Timed out waiting for exact-head sandbox candidate UI5 validation.' >&2
          exit 1

      - name: Download exact UI5 candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p handoff
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "wc-order-splitter-sandbox-ui5-$HEAD_SHA" \
            --dir handoff
          test -f handoff/wc-order-splitter-sandbox-ui5.zip
          test -f handoff/wc-order-splitter-sandbox-ui5.zip.sha256
          (cd handoff && sha256sum -c wc-order-splitter-sandbox-ui5.zip.sha256)
          unzip -p handoff/wc-order-splitter-sandbox-ui5.zip wc-order-splitter/sandbox-candidate.txt | grep -Fq 'sandbox testing only'
          unzip -p handoff/wc-order-splitter-sandbox-ui5.zip wc-order-splitter/sandbox-candidate.txt | grep -Fq 'Review, Confirm and Execute actions in the WooCommerce Backbone modal footer by phase'
          unzip -p handoff/wc-order-splitter-sandbox-ui5.zip wc-order-splitter/js/p2-split-strategy-admin.js | grep -Fq "feedbackBox.className = 'wcos-strategy-feedback';"
          unzip -p handoff/wc-order-splitter-sandbox-ui5.zip wc-order-splitter/js/p2-split-strategy-admin.js | grep -Fq 'footer.appendChild(reviewButton);'
          unzip -p handoff/wc-order-splitter-sandbox-ui5.zip wc-order-splitter/js/p2-split-strategy-admin.js | grep -Fq 'footer.appendChild(confirmButton);'
          unzip -p handoff/wc-order-splitter-sandbox-ui5.zip wc-order-splitter/js/p2-split-strategy-admin.js | grep -Fq 'footer.appendChild(executeButton);'
          unzip -p handoff/wc-order-splitter-sandbox-ui5.zip wc-order-splitter/css/p2-backbone-modal.css | grep -Fq 'justify-content: flex-end !important;'

      - name: Upload reviewed sandbox UI5 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wc-order-splitter-sandbox-ui5-reviewed-${{ github.event.pull_request.head.sha }}
          path: |
            handoff/wc-order-splitter-sandbox-ui5.zip
            handoff/wc-order-splitter-sandbox-ui5.zip.sha256
          if-no-files-found: error
          retention-days: 14
