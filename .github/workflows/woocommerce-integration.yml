name: WooCommerce integration smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-smoke:
    name: ${{ matrix.storage }} storage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        storage: [legacy, hpos]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install wp-env
        run: npm install --global @wordpress/env

      - name: Start pinned WordPress environment
        run: wp-env start

      - name: Activate WooCommerce and Order Splitter
        shell: bash
        run: |
          set -euo pipefail
          wp-env run cli wp plugin activate woocommerce
          wp-env run cli wp plugin activate wc-order-splitter
          wp-env run cli wp plugin status woocommerce
          wp-env run cli wp plugin status wc-order-splitter

      - name: Configure order storage
        shell: bash
        env:
          STORAGE_MODE: ${{ matrix.storage }}
        run: |
          set -euo pipefail
          if [ "$STORAGE_MODE" = 'hpos' ]; then
            wp-env run cli wp option update woocommerce_custom_orders_table_enabled yes
            wp-env run cli wp option update woocommerce_custom_orders_table_data_sync_enabled no
          else
            wp-env run cli wp option update woocommerce_custom_orders_table_enabled no
            wp-env run cli wp option update woocommerce_custom_orders_table_data_sync_enabled no
          fi
          wp-env run cli wp cache flush

      - name: Run read-only preflight smoke test
        shell: bash
        env:
          STORAGE_MODE: ${{ matrix.storage }}
        run: |
          set -euo pipefail
          wp-env run cli wp eval-file /var/www/html/wp-content/plugins/wc-order-splitter/tests/integration/preflight-smoke.php "$STORAGE_MODE"

      - name: Print debug log on failure
        if: failure()
        run: wp-env run cli sh -lc 'test ! -f /var/www/html/wp-content/debug.log || cat /var/www/html/wp-content/debug.log'

      - name: Stop environment
        if: always()
        run: wp-env stop
