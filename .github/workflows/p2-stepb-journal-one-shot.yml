name: P2 Step B fixture one-shot applicator

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/order-splitter-p2-whole-line-runtime-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/order-splitter-p2-whole-line-runtime-v2
          fetch-depth: 0

      - name: Fix whole-line stock lifecycle fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/p2-whole-line-runtime-smoke.php')
          text = path.read_text()
          old = """list($source, $a_item_id, $b_item_id) = wcos_whole_line_runtime_order($product_a, 2, $product_b, 3, 'processing');
$source_id = $source->get_id();
wc_reduce_stock_levels($source);
$source->get_data_store()->set_stock_reduced($source_id, true);
$source = wc_get_order($source_id);
"""
          new = """list($source, $a_item_id, $b_item_id) = wcos_whole_line_runtime_order($product_a, 2, $product_b, 3, 'pending');
$source_id = $source->get_id();
$source->update_status('processing');
$source = wc_get_order($source_id);
wcos_p2_adapter_assert('28.000000' === WCOS_Decimal::normalize(wc_get_product($product_a->get_id())->get_stock_quantity(), 6), 'Processing did not reduce the moved product exactly once.');
wcos_p2_adapter_assert('37.000000' === WCOS_Decimal::normalize(wc_get_product($product_b->get_id())->get_stock_quantity(), 6), 'Processing did not reduce the residual product exactly once.');
"""
          if old not in text:
              raise SystemExit('Whole-line stock fixture anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          php -l tests/integration/p2-whole-line-runtime-smoke.php
          git diff --check

      - name: Commit fixture correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "YoOhw CI"
          git config user.email "actions@users.noreply.github.com"
          git add tests/integration/p2-whole-line-runtime-smoke.php
          git commit -m "P2 whole-line: fix stock lifecycle fixture"
          git push origin HEAD:codex/order-splitter-p2-whole-line-runtime-v2
