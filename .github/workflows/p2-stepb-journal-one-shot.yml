name: P2 Step B journal one-shot patch

on:
  push:
    branches:
      - codex/order-splitter-p2-whole-line-runtime-v2
    paths:
      - .github/workflows/p2-stepb-journal-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/order-splitter-p2-whole-line-runtime-v2
          fetch-depth: 0
      - name: Lock whole-line journal authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('inc/domain/class-wcos-operation-journal.php')
          text = path.read_text()
          needle = """        foreach (array('price_precision', 'policy_version') as $field) {
            if (array_key_exists($field, $current_context)) {
                if (!array_key_exists($field, $replacement_context)
                    || (int) $current_context[$field] !== (int) $replacement_context[$field]) {
                    return false;
                }
            }
        }

        return true;
"""
          replacement = """        foreach (array('price_precision', 'policy_version') as $field) {
            if (array_key_exists($field, $current_context)) {
                if (!array_key_exists($field, $replacement_context)
                    || (int) $current_context[$field] !== (int) $replacement_context[$field]) {
                    return false;
                }
            }
        }

        foreach (array('execution_policy', 'fully_moved_item_ids') as $field) {
            if (array_key_exists($field, $current_context)) {
                if (!array_key_exists($field, $replacement_context)
                    || $current_context[$field] !== $replacement_context[$field]) {
                    return false;
                }
            }
        }

        return true;
"""
          if needle not in text:
              raise SystemExit('Operation journal immutable-field anchor not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          php -l inc/domain/class-wcos-operation-journal.php
          git diff --check
      - name: Commit journal hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "YoOhw CI"
          git config user.email "actions@users.noreply.github.com"
          git add inc/domain/class-wcos-operation-journal.php
          git commit -m "P2 whole-line: lock destructive journal context"
          git push origin HEAD:codex/order-splitter-p2-whole-line-runtime-v2
