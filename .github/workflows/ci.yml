name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify-pr-scope:
    name: Classify PR CI profile
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.classify.outputs.profile }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout complete authority graph
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify exact base-to-head scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            printf 'profile=FULL\nreason=non_pull_request_event\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -n "$PR_BASE_SHA"
          test -n "$PR_HEAD_SHA"
          base_classifier="$RUNNER_TEMP/classify-pr-scope.sh"
          if ! git cat-file -e "$PR_BASE_SHA:.github/scripts/classify-pr-scope.sh" 2>/dev/null; then
            printf 'profile=FULL\nreason=classifier_not_present_in_base\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git show "$PR_BASE_SHA:.github/scripts/classify-pr-scope.sh" > "$base_classifier"
          chmod +x "$base_classifier"
          "$base_classifier" "$EVENT_NAME" "$PR_BASE_SHA" "$PR_HEAD_SHA" "$PR_HEAD_REF" "$GITHUB_OUTPUT"

      - name: Log exact classifier authority
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROFILE: ${{ steps.classify.outputs.profile }}
          REASON: ${{ steps.classify.outputs.reason }}
        run: |
          set -euo pipefail
          test "$PROFILE" = FULL || test "$PROFILE" = DIRECT_CSS_FAST
          echo "event_name=$EVENT_NAME"
          echo "pr_base_sha=$PR_BASE_SHA"
          echo "pr_head_sha=$PR_HEAD_SHA"
          echo "ci_profile=$PROFILE"
          echo "ci_profile_reason=$REASON"

  php-syntax:
    name: PHP syntax and unit contracts (PHP ${{ matrix.php }})
    needs: classify-pr-scope
    if: needs['classify-pr-scope'].outputs.profile == 'FULL'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

      - name: Run mutation-domain unit tests
        run: php tests/unit/run.php

  foundation-contract:
    name: Architecture and approved production gate contract
    needs: classify-pr-scope
    if: needs['classify-pr-scope'].outputs.profile == 'FULL'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Record exact PR merge-candidate authority
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -n "$PR_HEAD_SHA"
          test -n "$PR_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "pr_head_sha=$PR_HEAD_SHA"
          echo "pr_base_sha=$PR_BASE_SHA"
          echo "merge_candidate_sha=$(git rev-parse HEAD)"
          echo "merge_candidate_tree_sha=$(git rev-parse HEAD^{tree})"
          echo "merge_candidate_parent_shas=$(git show -s --format=%P HEAD)"

      - name: Verify CI and package workflow topology
        shell: bash
        run: tests/ci/workflow-contract.sh

      - name: Run path-aware CI profile regressions
        shell: bash
        run: |
          tests/ci/direct-css-fast-contract.sh
          tests/ci/required-ci-profile-contract.sh

      - name: Reject removed telemetry integration
        shell: bash
        run: |
          set -euo pipefail
          telemetry_host='yoexpress''.''top'
          test ! -e inc/cores/api/push-subscription.php
          if grep -R --line-number --fixed-strings "$telemetry_host" --include='*.php' --include='*.js' --include='*.txt' . --exclude-dir=.git; then
            echo 'Removed telemetry endpoint must not be present.' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'WC_Order_Splitter_Push_Subscription' --include='*.php' . --exclude-dir=.git; then
            echo 'Removed telemetry class must not be referenced.' >&2
            exit 1
          fi

      - name: Verify approved production gate state
        shell: bash
        run: |
          set -euo pipefail
          plugin_version=$(sed -n 's/^ \* Version: //p' wc-order-splitter.php | head -n 1)
          stable_tag=$(sed -n 's/^Stable tag: //p' readme.txt | head -n 1)
          test -n "$plugin_version"
          test -n "$stable_tag"
          test "$plugin_version" = "$stable_tag"
          grep -Fq 'Requires at least: 6.5' wc-order-splitter.php
          grep -Fq 'Requires at least: 6.5' readme.txt
          grep -Fq 'return WCOS_Feature_Gates::any_enabled();' inc/cores/safety.php
          grep -Fq 'self::SPLIT => true' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'self::DUPLICATE => true' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'self::MERGE => true' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'self::RETURN_ORDER => true' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'self::BULK_RETURN => true' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'self::MANUAL_QUANTITY => true' inc/domain/class-wcos-split-strategy-gates.php
          grep -Fq 'self::CATEGORY => true' inc/domain/class-wcos-split-strategy-gates.php
          grep -Fq 'self::STOCK_STATUS => true' inc/domain/class-wcos-split-strategy-gates.php
          grep -Fq 'Legacy mutation handlers are deliberately never loaded here.' inc/cores/script.php

          if grep -R --line-number -E 'WC_ORDER_SPLITTER_(MUTATIONS|SPLIT|DUPLICATE|MERGE|RETURN|BULK_RETURN)_ENABLED' \
            wc-order-splitter.php inc/cores inc/domain; then
            echo 'An externally overrideable mutation gate returned to runtime source.' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'wc-merged' wc-order-splitter.php inc; then
            echo 'A custom production merged order status was introduced.' >&2
            exit 1
          fi

      - name: Enforce one mutation engine and mandatory controller gateway
        shell: bash
        run: |
          set -euo pipefail
          test ! -d inc/mutation-v2
          test ! -d tests/v2

          for legacy_handler in \
            'orders-bulk-return.php' \
            'order-split-button.php' \
            'order-return-option.php' \
            'order-duplicate-option.php' \
            'order-merge-option.php'; do
            if grep -F "$legacy_handler" inc/cores/script.php; then
              echo "Legacy mutation handler must not be loaded: $legacy_handler" >&2
              exit 1
            fi
          done

          if grep -R --line-number -E 'new[[:space:]]+WCOS_((Split|Duplicate|Return)_Order_Service|Merge_(Order_Service|WooCommerce_Adapter))' inc/backend inc/cores; then
            echo 'A production controller bypasses WCOS_Mutation_Gateway.' >&2
            exit 1
          fi

          grep -Fq 'WCOS_Feature_Gates::assert_enabled' inc/domain/class-wcos-mutation-gateway.php
          grep -Fq 'WCOS_Order_Mutation_Authorizer::assert_workflow' inc/domain/class-wcos-mutation-gateway.php
          grep -Fq 'new WCOS_Duplicate_WooCommerce_Adapter' inc/domain/class-wcos-mutation-gateway.php
          grep -Fq 'class-wcos-duplicate-preflight.php' inc/cores/script.php
          grep -Fq 'class-wcos-duplicate-woocommerce-adapter.php' inc/cores/script.php
          grep -Fq 'class-wcos-duplicate-confirmation-store.php' inc/cores/script.php
          grep -Fq 'class-wcos-duplicate-admin-controller.php' inc/cores/script.php
          grep -Fq 'class-wcos-split-strategy-review-store.php' inc/cores/script.php
          grep -Fq 'class-wcos-split-strategy-confirmation-store.php' inc/cores/script.php
          grep -Fq 'class-wcos-split-strategy-admin-controller.php' inc/cores/script.php
          grep -Fq 'WCOS_Split_Strategy_Admin_Controller::bootstrap();' inc/cores/script.php
          grep -Fq 'class-wcos-multi-order-lease.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-plan.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-context-signature.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-journal-context.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-participation.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-recovery-snapshot.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-recovery-state-graph.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-commit-guard.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-compensator.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-preflight.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-retirement-policy.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-order-service.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-woocommerce-adapter.php' inc/cores/script.php
          grep -Fq 'new WCOS_Merge_WooCommerce_Adapter' inc/domain/class-wcos-mutation-gateway.php
          grep -Fq 'const APPROVED = self::NON_FORCE_TRASH_ARCHIVE;' inc/domain/class-wcos-merge-retirement-policy.php
          grep -Fq 'class-wcos-merge-review-store.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-confirmation-store.php' inc/cores/script.php
          grep -Fq 'class-wcos-merge-admin-controller.php' inc/cores/script.php
          grep -Fq 'WCOS_Merge_Admin_Controller::bootstrap();' inc/cores/script.php
          grep -Fq 'class-wcos-return-participation.php' inc/cores/script.php
          grep -Fq 'class-wcos-return-plan.php' inc/cores/script.php
          grep -Fq 'class-wcos-return-lineage-authority.php' inc/cores/script.php
          grep -Fq 'class-wcos-return-preflight.php' inc/cores/script.php
          grep -Fq 'class-wcos-return-journal-context.php' inc/cores/script.php
          grep -Fq 'class-wcos-return-recovery-snapshot.php' inc/cores/script.php
          grep -Fq 'class-wcos-return-recovery-state-graph.php' inc/cores/script.php
          grep -Fq 'class-wcos-return-commit-guard.php' inc/cores/script.php
          grep -Fq 'class-wcos-return-compensator.php' inc/cores/script.php
          grep -Fq 'class-wcos-return-retirement-policy.php' inc/cores/script.php
          grep -Fq 'class-wcos-return-source-evolution-authority.php' inc/cores/script.php
          grep -Fq 'class-wcos-legacy-return-compatibility-authority.php' inc/cores/script.php
          grep -Fq "'return' === \$type" inc/domain/class-wcos-mutation-recovery-coordinator.php
          grep -Fq 'const APPROVED = self::NON_FORCE_TRASH_ARCHIVE;' inc/domain/class-wcos-return-retirement-policy.php
          grep -Fq 'class-wcos-return-order-service.php' inc/cores/script.php
          grep -Fq 'class-wcos-return-woocommerce-adapter.php' inc/cores/script.php
          grep -Fq 'new WCOS_Return_WooCommerce_Adapter' inc/domain/class-wcos-mutation-gateway.php
          grep -Fq 'class-wcos-return-review-store.php' inc/cores/script.php
          grep -Fq 'class-wcos-return-confirmation-store.php' inc/cores/script.php
          grep -Fq 'class-wcos-return-admin-controller.php' inc/cores/script.php
          grep -Fq 'WCOS_Return_Admin_Controller::bootstrap();' inc/cores/script.php
          test -e js/p2-return-admin.js
          test -e css/p2-return-admin.css
          grep -Fq "'wcos-return-admin'" inc/backend/class-wcos-admin-backbone-modal-assets.php
          grep -Fq 'window.WCOSBackboneModal.open' js/p2-return-admin.js
          grep -Fq "const SEARCH_ACTION = 'wcos_merge_target_search';" inc/backend/class-wcos-merge-admin-controller.php
          grep -Fq "'wcos-merge-admin'" inc/backend/class-wcos-admin-backbone-modal-assets.php
          grep -Fq 'window.WCOSBackboneModal.open' js/p2-merge-admin.js
          grep -Fq 'inc/domain/' AGENTS.md
          grep -Fq 'inc/domain/' docs/order-mutation-v2-contract.md

      - name: Run strategy modal feedback lifecycle regression
        run: node tests/js/p2-strategy-modal-feedback-lifecycle.js

      - name: Run Split method focus lifecycle regression
        run: node tests/js/p2-split-method-focus-lifecycle.js

      - name: Run Split quantity-step integer-unit regression
        run: node tests/js/p2-split-quantity-step-math.js

      - name: Verify Return admin client syntax
        run: node --check js/p2-return-admin.js

      - name: Run Return focus lifecycle regression
        run: node tests/js/p2-return-focus-lifecycle.js

  package-check:
    name: Package safety contract
    needs: classify-pr-scope
    if: needs['classify-pr-scope'].outputs.profile == 'FULL'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate canonical distributable tree without an archive
        shell: bash
        run: .github/scripts/validate-distribution-contract.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/distribution/wc-order-splitter"

      - name: Run fail-closed distribution contract regressions
        shell: bash
        run: tests/ci/distribution-contract.sh
  integration-smoke:
    name: WooCommerce 11.0.1 / ${{ matrix.storage }} storage
    needs: [classify-pr-scope, php-syntax, foundation-contract]
    if: needs['classify-pr-scope'].outputs.profile == 'FULL'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        storage: [legacy, hpos, hpos-sync]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stage exact public 1.4.11 baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline_sha=e1d8aeb8eff38f4ce69dad1a08993e17521c6359
          baseline_tree=75140a414cd637d134f860d8a70e7f92cbe4853c
          baseline_dir=tests/integration/.wcos-compat-003-baseline
          test "$(git rev-parse "$baseline_sha")" = "$baseline_sha"
          test "$(git rev-parse "$baseline_sha^{tree}")" = "$baseline_tree"
          test ! -e "$baseline_dir"
          mkdir -p "$baseline_dir"
          git archive "$baseline_sha" | tar -x -C "$baseline_dir"
          test "$(sed -n 's/^ \* Version: //p' "$baseline_dir/wc-order-splitter.php" | head -n 1)" = 1.4.11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install wp-env
        run: npm install --no-audit --no-fund

      - name: Start WordPress
        run: npx wp-env start

      - name: Install and activate WooCommerce 11.0.1
        run: npx wp-env run cli wp plugin install https://downloads.wordpress.org/plugin/woocommerce.11.0.1.zip --activate

      - name: Configure legacy order storage
        if: matrix.storage == 'legacy'
        run: |
          npx wp-env run cli wp option update woocommerce_custom_orders_table_enabled no
          npx wp-env run cli wp option update woocommerce_custom_orders_table_data_sync_enabled no

      - name: Configure HPOS-only order storage
        if: matrix.storage == 'hpos'
        run: |
          npx wp-env run cli wp option update woocommerce_custom_orders_table_enabled yes
          npx wp-env run cli wp option update woocommerce_custom_orders_table_data_sync_enabled no

      - name: Configure HPOS compatibility mode
        if: matrix.storage == 'hpos-sync'
        run: |
          npx wp-env run cli wp option update woocommerce_custom_orders_table_enabled yes
          npx wp-env run cli wp option update woocommerce_custom_orders_table_data_sync_enabled yes

      - name: Install exact public 1.4.11 baseline beside the current checkout
        run: |
          npx wp-env run cli wp eval '
            $source = WP_PLUGIN_DIR . "/wc-order-splitter/tests/integration/.wcos-compat-003-baseline";
            $target = WP_PLUGIN_DIR . "/wcos-legacy-1-4-11";
            if (!is_dir($source) || file_exists($target) || !wp_mkdir_p($target)) { exit(1); }
            $iterator = new RecursiveIteratorIterator(
              new RecursiveDirectoryIterator($source, FilesystemIterator::SKIP_DOTS),
              RecursiveIteratorIterator::SELF_FIRST
            );
            foreach ($iterator as $entry) {
              $relative = substr($entry->getPathname(), strlen($source) + 1);
              $destination = $target . "/" . $relative;
              if ($entry->isDir()) {
                if (!wp_mkdir_p($destination)) { exit(1); }
              } elseif (!copy($entry->getPathname(), $destination)) {
                exit(1);
              }
            }
          '

      - name: Create a genuine Split fixture with exact public 1.4.11
        run: |
          npx wp-env run cli wp plugin activate wcos-legacy-1-4-11
          npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/compat-legacy-1-4-11-create.php
          npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/compat-legacy-1-4-11-seal.php
          npx wp-env run cli wp plugin deactivate wcos-legacy-1-4-11

      - name: Remove exact public 1.4.11 before current runtime validation
        run: npx wp-env run cli wp plugin delete wcos-legacy-1-4-11

      - name: Install early-translation monitor
        run: |
          npx wp-env run cli wp eval '
            wp_mkdir_p(WPMU_PLUGIN_DIR);
            @unlink(WP_CONTENT_DIR . "/wcos-early-translation.jsonl");
            $source = WP_PLUGIN_DIR . "/wc-order-splitter/tests/integration/early-translation-monitor.php";
            $target = WPMU_PLUGIN_DIR . "/wcos-early-translation-monitor.php";
            if (!copy($source, $target)) { exit(1); }
          '

      - name: Activate Order Splitter after the in-place fixture upgrade
        run: npx wp-env run cli wp plugin activate wc-order-splitter

      - name: Reject early WooCommerce translation loading
        run: |
          npx wp-env run cli wp eval '
            $log = WP_CONTENT_DIR . "/wcos-early-translation.jsonl";
            if (file_exists($log) && filesize($log) > 0) {
              fwrite(STDERR, file_get_contents($log));
              exit(1);
            }
            echo "early-translation-loading-ok\n";
          '

      - name: Verify plugin, storage mode, and enabled production gate state
        shell: bash
        run: |
          set -euo pipefail
          npx wp-env run cli wp plugin is-active woocommerce
          npx wp-env run cli wp plugin is-active wc-order-splitter
          npx wp-env run cli wp eval '
            $expected = "${{ matrix.storage }}";
            $hpos = \Automattic\WooCommerce\Utilities\OrderUtil::custom_orders_table_usage_is_enabled();
            if (("legacy" === $expected && $hpos) || ("legacy" !== $expected && !$hpos)) { exit(1); }
            if (!WCOS_Feature_Gates::enabled(WCOS_Feature_Gates::SPLIT)) { exit(1); }
            if (!WCOS_Feature_Gates::enabled(WCOS_Feature_Gates::DUPLICATE)) { exit(1); }
            if (!WCOS_Feature_Gates::enabled(WCOS_Feature_Gates::MERGE)) { exit(1); }
            if (!WCOS_Feature_Gates::any_enabled()) { exit(1); }
            if (!WC_Order_Splitter_Safety_Guard::mutations_enabled()) { exit(1); }
            if (!WCOS_Feature_Gates::enabled(WCOS_Feature_Gates::RETURN_ORDER)) { exit(1); }
            if (!WCOS_Feature_Gates::enabled(WCOS_Feature_Gates::BULK_RETURN)) { exit(1); }
            if (!(WCOS_Bulk_Return_Admin_Controller::bootstrap() instanceof WCOS_Bulk_Return_Admin_Controller)) { exit(1); }
            foreach (array(
              WCOS_Bulk_Return_Admin_Controller::REVIEW_ACTION,
              WCOS_Bulk_Return_Admin_Controller::CONFIRM_ACTION,
              WCOS_Bulk_Return_Admin_Controller::EXECUTE_ACTION,
              WCOS_Bulk_Return_Admin_Controller::RESUME_ACTION
            ) as $bulk_return_action) {
              if (false === has_action("wp_ajax_" . $bulk_return_action)) { exit(1); }
            }
            if (!(WCOS_Return_Admin_Controller::bootstrap() instanceof WCOS_Return_Admin_Controller)) { exit(1); }
            foreach (array(
              WCOS_Return_Admin_Controller::REVIEW_ACTION,
              WCOS_Return_Admin_Controller::CONFIRM_ACTION,
              WCOS_Return_Admin_Controller::EXECUTE_ACTION
            ) as $return_action) {
              if (false === has_action("wp_ajax_" . $return_action)) { exit(1); }
            }
            if (!WCOS_Split_Strategy_Gates::enabled(WCOS_Split_Strategy_Gates::MANUAL_QUANTITY)) { exit(1); }
            if (!WCOS_Split_Strategy_Gates::enabled(WCOS_Split_Strategy_Gates::CATEGORY)) { exit(1); }
            if (!WCOS_Split_Strategy_Gates::enabled(WCOS_Split_Strategy_Gates::STOCK_STATUS)) { exit(1); }
            if (false === has_action("wp_ajax_" . WCOS_Split_Strategy_Admin_Controller::REVIEW_ACTION)) { exit(1); }
            if (false === has_action("wp_ajax_" . WCOS_Split_Strategy_Admin_Controller::CONFIRM_ACTION)) { exit(1); }
            if (false === has_action("wp_ajax_" . WCOS_Split_Strategy_Admin_Controller::EXECUTE_ACTION)) { exit(1); }
            foreach (array(
              WCOS_Merge_Admin_Controller::SEARCH_ACTION,
              WCOS_Merge_Admin_Controller::REVIEW_ACTION,
              WCOS_Merge_Admin_Controller::CONFIRM_ACTION,
              WCOS_Merge_Admin_Controller::EXECUTE_ACTION
            ) as $merge_action) {
              if (false === has_action("wp_ajax_" . $merge_action)) { exit(1); }
            }
            $has_controller_method = static function($hook, $class, $method) {
              global $wp_filter;
              if (empty($wp_filter[$hook]) || empty($wp_filter[$hook]->callbacks)) { return false; }
              foreach ($wp_filter[$hook]->callbacks as $callbacks) {
                foreach ($callbacks as $callback) {
                  $function = isset($callback["function"]) ? $callback["function"] : null;
                  if (is_array($function)
                    && isset($function[0], $function[1])
                    && $function[0] instanceof $class
                    && $method === $function[1]) { return true; }
                }
              }
              return false;
            };
            foreach (array(
              "wp_ajax_" . WCOS_Merge_Admin_Controller::SEARCH_ACTION => "ajax_search",
              "wp_ajax_" . WCOS_Merge_Admin_Controller::REVIEW_ACTION => "ajax_review",
              "wp_ajax_" . WCOS_Merge_Admin_Controller::CONFIRM_ACTION => "ajax_confirm",
              "wp_ajax_" . WCOS_Merge_Admin_Controller::EXECUTE_ACTION => "ajax_execute",
              "admin_footer" => "render_dialog",
              "admin_enqueue_scripts" => "enqueue_assets"
            ) as $hook => $method) {
              if (!$has_controller_method($hook, "WCOS_Merge_Admin_Controller", $method)) { exit(1); }
            }
            if (!$has_controller_method("woocommerce_order_actions_end", "WCOS_Order_Actions_Launcher_Row", "render_launcher_row")) { exit(1); }
            if ($has_controller_method("woocommerce_order_item_add_action_buttons", "WCOS_Duplicate_Admin_Controller", "render_launcher")) { exit(1); }
