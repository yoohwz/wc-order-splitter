          worker_b_status=$?
          set -e

          printf 'worker-a-status=%s\nworker-b-status=%s\n' "$worker_a_status" "$worker_b_status"
          for worker_log in /tmp/wcos-bulk-execute-worker-a.log /tmp/wcos-bulk-execute-worker-b.log; do
            printf '%s\n' "--- $(basename "$worker_log") (sanitized) ---"
            sed -E \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[REDACTED_EMAIL]/g' \
              -e 's/[A-Za-z0-9]{40,}/[REDACTED_SECRET]/g' \
              "$worker_log"
          done

          test "$worker_a_status" -eq 0
          test "$worker_b_status" -eq 0

          grep -E '^(RESULT|RETRY) ' /tmp/wcos-bulk-execute-worker-a.log /tmp/wcos-bulk-execute-worker-b.log | sed -E 's#^/tmp/[^:]+:##'
          npx wp-env run cli wp eval-file "$postcheck"

          cleanup_bulk_execute_race
          trap - EXIT

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop

  direct-css-fast:
    name: CODEX_DIRECT focused CSS contract
    needs: classify-pr-scope
    if: needs['classify-pr-scope'].outputs.profile == 'DIRECT_CSS_FAST'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete authority graph
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record exact PR merge-candidate authority
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -n "$PR_HEAD_SHA"
          test -n "$PR_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "pr_head_sha=$PR_HEAD_SHA"
          echo "pr_base_sha=$PR_BASE_SHA"
          echo "merge_candidate_sha=$(git rev-parse HEAD)"
          echo "merge_candidate_tree_sha=$(git rev-parse HEAD^{tree})"
          echo "merge_candidate_parent_shas=$(git show -s --format=%P HEAD)"

      - name: Revalidate strict direct CSS scope and safety
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          profile=$(.github/scripts/classify-pr-scope.sh pull_request "$PR_BASE_SHA" "$PR_HEAD_SHA" "$PR_HEAD_REF" | sed -n 's/^ci_profile=//p')
          test "$profile" = DIRECT_CSS_FAST
          git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"
          tests/ci/direct-css-fast-contract.sh
          tests/ci/required-ci-profile-contract.sh

      - name: Prove runtime, gate, distribution, workflow, and version authority unchanged
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          for authority_path in \
            wc-order-splitter.php \
            readme.txt \
            inc/domain/class-wcos-feature-gates.php \
            inc/domain/class-wcos-split-strategy-gates.php \
            .github/workflows/ci.yml \
            .github/workflows/main-attestation.yml \
            .github/scripts/classify-pr-scope.sh \
            .github/scripts/validate-distribution-contract.sh \
            docs/codex-direct-workflow.md; do
            test "$(git rev-parse "$PR_BASE_SHA:$authority_path")" = "$(git rev-parse "$PR_HEAD_SHA:$authority_path")"
          done
          tests/ci/workflow-contract.sh
          echo 'direct-css-fast-artifacts=0'

  required:
    name: Required CI
    if: always()
    needs:
      - classify-pr-scope
      - php-syntax
      - foundation-contract
      - package-check
      - integration-smoke
      - direct-css-fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete authority graph
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify all required jobs passed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CLASSIFIER_RESULT: ${{ needs['classify-pr-scope'].result }}
          CI_PROFILE: ${{ needs['classify-pr-scope'].outputs.profile }}
          CI_PROFILE_REASON: ${{ needs['classify-pr-scope'].outputs.reason }}
          PHP_SYNTAX_RESULT: ${{ needs['php-syntax'].result }}
          FOUNDATION_RESULT: ${{ needs['foundation-contract'].result }}
          PACKAGE_RESULT: ${{ needs['package-check'].result }}
          INTEGRATION_RESULT: ${{ needs['integration-smoke'].result }}
          DIRECT_CSS_FAST_RESULT: ${{ needs['direct-css-fast'].result }}
        run: |
          set -euo pipefail
          aggregator="$RUNNER_TEMP/verify-required-ci.sh"
          if [[ "$EVENT_NAME" == pull_request ]] && git cat-file -e "$PR_BASE_SHA:.github/scripts/verify-required-ci.sh" 2>/dev/null; then
            git show "$PR_BASE_SHA:.github/scripts/verify-required-ci.sh" > "$aggregator"
          else
            cp .github/scripts/verify-required-ci.sh "$aggregator"
          fi
          chmod +x "$aggregator"
          "$aggregator" \
            "$CLASSIFIER_RESULT" \
            "$CI_PROFILE" \
            "$CI_PROFILE_REASON" \
            "$PHP_SYNTAX_RESULT" \
            "$FOUNDATION_RESULT" \
            "$PACKAGE_RESULT" \
            "$INTEGRATION_RESULT" \
            "$DIRECT_CSS_FAST_RESULT"
