name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP syntax and unit contracts (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

      - name: Run mutation-domain unit tests
        run: php tests/unit/run.php

  foundation-contract:
    name: Architecture and approved production gate contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject removed telemetry integration
        shell: bash
        run: |
          set -euo pipefail
          telemetry_host='yoexpress''.''top'
          test ! -e inc/cores/api/push-subscription.php
          if grep -R --line-number --fixed-strings "$telemetry_host" --include='*.php' --include='*.js' --include='*.txt' . --exclude-dir=.git; then
            echo 'Removed telemetry endpoint must not be present.' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'WC_Order_Splitter_Push_Subscription' --include='*.php' . --exclude-dir=.git; then
            echo 'Removed telemetry class must not be referenced.' >&2
            exit 1
          fi

      - name: Verify approved production gate state
        shell: bash
        run: |
          set -euo pipefail
          plugin_version=$(sed -n 's/^ \* Version: //p' wc-order-splitter.php | head -n 1)
          stable_tag=$(sed -n 's/^Stable tag: //p' readme.txt | head -n 1)
          test -n "$plugin_version"
          test -n "$stable_tag"
          test "$plugin_version" = "$stable_tag"
          grep -Fq 'Requires at least: 6.5' wc-order-splitter.php
          grep -Fq 'Requires at least: 6.5' readme.txt
          grep -Fq 'return WCOS_Feature_Gates::any_enabled();' inc/cores/safety.php
          grep -Fq 'self::SPLIT => true' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'self::DUPLICATE => false' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'self::MERGE => false' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'self::RETURN_ORDER => false' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'self::BULK_RETURN => false' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'Legacy mutation handlers are deliberately never loaded here.' inc/cores/script.php

          if grep -R --line-number -E 'WC_ORDER_SPLITTER_(MUTATIONS|SPLIT|DUPLICATE|MERGE|RETURN|BULK_RETURN)_ENABLED' \
            wc-order-splitter.php inc/cores inc/domain; then
            echo 'An externally overrideable mutation gate returned to runtime source.' >&2
            exit 1
          fi

      - name: Enforce one mutation engine and mandatory controller gateway
        shell: bash
        run: |
          set -euo pipefail
          test ! -d inc/mutation-v2
          test ! -d tests/v2

          for legacy_handler in \
            'orders-bulk-return.php' \
            'order-split-button.php' \
            'order-return-option.php' \
            'order-duplicate-option.php' \
            'order-merge-option.php'; do
            if grep -F "$legacy_handler" inc/cores/script.php; then
              echo "Legacy mutation handler must not be loaded: $legacy_handler" >&2
              exit 1
            fi
          done

          if grep -R --line-number -E 'new[[:space:]]+WCOS_(Split|Duplicate)_Order_Service' inc/backend inc/cores; then
            echo 'A production controller bypasses WCOS_Mutation_Gateway.' >&2
            exit 1
          fi

          grep -Fq 'WCOS_Feature_Gates::assert_enabled' inc/domain/class-wcos-mutation-gateway.php
          grep -Fq 'WCOS_Order_Mutation_Authorizer::assert_workflow' inc/domain/class-wcos-mutation-gateway.php
          grep -Fq 'new WCOS_Duplicate_WooCommerce_Adapter' inc/domain/class-wcos-mutation-gateway.php
          grep -Fq 'class-wcos-duplicate-preflight.php' inc/cores/script.php
          grep -Fq 'class-wcos-duplicate-woocommerce-adapter.php' inc/cores/script.php
          grep -Fq 'class-wcos-duplicate-confirmation-store.php' inc/cores/script.php
          grep -Fq 'class-wcos-duplicate-admin-controller.php' inc/cores/script.php
          grep -Fq 'inc/domain/' AGENTS.md
          grep -Fq 'inc/domain/' docs/order-mutation-v2-contract.md

  package-check:
    name: Package safety contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release metadata and production gate contract
        shell: bash
        run: |
          set -euo pipefail
          plugin_version=$(sed -n 's/^ \* Version: //p' wc-order-splitter.php | head -n 1)
          stable_tag=$(sed -n 's/^Stable tag: //p' readme.txt | head -n 1)

          test -n "$plugin_version"
          test -n "$stable_tag"
          test "$plugin_version" = "$stable_tag"
          grep -Fq 'return WCOS_Feature_Gates::any_enabled();' inc/cores/safety.php
          grep -Fq 'self::SPLIT => true' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'self::DUPLICATE => false' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'self::MERGE => false' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'self::RETURN_ORDER => false' inc/domain/class-wcos-feature-gates.php
          grep -Fq 'self::BULK_RETURN => false' inc/domain/class-wcos-feature-gates.php
          test ! -d inc/mutation-v2

          telemetry_host='yoexpress''.''top'
          if grep -R --line-number --fixed-strings "$telemetry_host" \
            wc-order-splitter.php readme.txt changelog.txt inc js \
            --include='*.php' --include='*.js' --include='*.txt'; then
            echo 'Removed telemetry endpoint must not be present in distributable source.' >&2
            exit 1
          fi

          if grep -R --line-number -E 'WC_ORDER_SPLITTER_(MUTATIONS|SPLIT|DUPLICATE|MERGE|RETURN|BULK_RETURN)_ENABLED' \
            wc-order-splitter.php inc/cores inc/domain; then
            echo 'Externally overrideable mutation gates must not return.' >&2
            exit 1
          fi

      - name: Build package tree
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/package/wc-order-splitter"
          mkdir -p "$package_root"

          rsync -a ./ "$package_root/" --exclude-from='.distignore'

          find "$package_root" -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done

          for forbidden_path in \
            'inc/backend/actions' \
            'inc/backend/orders-bulk-return.php' \
            'inc/backend/order-split-button.php' \
            'inc/backend/order-return-option.php' \
            'inc/backend/order-duplicate-option.php' \
            'inc/backend/order-merge-option.php' \
            'js/bulk-return-action.js' \
            'js/merge-action.js' \
            'js/post-action-tip.js' \
            'js/split-table.js' \
            'inc/mutation-v2' \
            'tests' \
            'docs' \
            'AGENTS.md'; do
            if test -e "$package_root/$forbidden_path"; then
              echo "Unsafe or development-only path entered package: $forbidden_path" >&2
              exit 1
            fi
          done

          for required_path in \
            'inc/backend/class-wcos-split-admin-controller.php' \
            'inc/backend/class-wcos-split-confirmation-store.php' \
            'inc/backend/class-wcos-split-request-parser.php' \
            'inc/domain/class-wcos-feature-gates.php' \
            'inc/domain/class-wcos-mutation-gateway.php' \
            'inc/domain/class-wcos-split-woocommerce-adapter.php' \
            'inc/domain/class-wcos-split-order-service.php' \
            'css/p2-split-admin.css' \
            'js/p2-split-admin.js' \
            'inc/backend/class-wcos-duplicate-admin-controller.php' \
            'inc/backend/class-wcos-duplicate-confirmation-store.php' \
            'inc/domain/class-wcos-duplicate-preflight.php' \
            'inc/domain/class-wcos-duplicate-woocommerce-adapter.php' \
            'inc/domain/class-wcos-duplicate-order-service.php' \
            'css/p2-duplicate-admin.css' \
            'js/p2-duplicate-admin.js'; do
            if test ! -e "$package_root/$required_path"; then
              echo "Required hardened mutation path is missing from package: $required_path" >&2
              exit 1
            fi
          done

          if find "$package_root" -type l | grep -q .; then
            echo 'Release package must not contain symbolic links.' >&2
            exit 1
          fi

          if grep -R --line-number -E 'yoexpress\.top|WC_Order_Splitter_Push_Subscription' "$package_root"; then
            echo 'Removed telemetry code entered the package.' >&2
            exit 1
          fi

          touch -t 200001010000 "$package_root"
          find "$package_root" -exec touch -t 200001010000 {} +

          cd "$RUNNER_TEMP/package"
          find wc-order-splitter -type f -print | LC_ALL=C sort | zip -X -q "$GITHUB_WORKSPACE/wc-order-splitter.zip" -@

      - name: Inspect package
        shell: bash
        run: |
          set -euo pipefail
          unzip -t wc-order-splitter.zip
          unzip -p wc-order-splitter.zip wc-order-splitter/wc-order-splitter.php | grep -Fq 'Plugin Name: Order Splitter for WooCommerce'
          archive_version=$(unzip -p wc-order-splitter.zip wc-order-splitter/wc-order-splitter.php | sed -n 's/^ \* Version: //p' | head -n 1)
          archive_stable_tag=$(unzip -p wc-order-splitter.zip wc-order-splitter/readme.txt | sed -n 's/^Stable tag: //p' | head -n 1)
          test -n "$archive_version"
          test "$archive_version" = "$archive_stable_tag"
          unzip -p wc-order-splitter.zip wc-order-splitter/inc/domain/class-wcos-feature-gates.php | grep -Fq 'self::SPLIT => true'
          unzip -p wc-order-splitter.zip wc-order-splitter/inc/domain/class-wcos-feature-gates.php | grep -Fq 'self::DUPLICATE => false'
          unzip -p wc-order-splitter.zip wc-order-splitter/inc/domain/class-wcos-feature-gates.php | grep -Fq 'self::MERGE => false'
          unzip -p wc-order-splitter.zip wc-order-splitter/inc/domain/class-wcos-feature-gates.php | grep -Fq 'self::RETURN_ORDER => false'
          unzip -p wc-order-splitter.zip wc-order-splitter/inc/domain/class-wcos-feature-gates.php | grep -Fq 'self::BULK_RETURN => false'
          unzip -Z1 wc-order-splitter.zip | grep -Fq 'wc-order-splitter/inc/backend/class-wcos-duplicate-admin-controller.php'
          unzip -Z1 wc-order-splitter.zip | grep -Fq 'wc-order-splitter/inc/domain/class-wcos-duplicate-woocommerce-adapter.php'
          unzip -Z1 wc-order-splitter.zip | grep -Fq 'wc-order-splitter/js/p2-duplicate-admin.js'
          unzip -Z1 wc-order-splitter.zip | grep -Fq 'wc-order-splitter/css/p2-duplicate-admin.css'
          if unzip -Z1 wc-order-splitter.zip | grep -E '(^|/)(tests|docs|node_modules|inc/mutation-v2)(/|$)|(^|/)AGENTS\.md$'; then
            echo 'Development-only content entered the ZIP.' >&2
            exit 1
          fi

  integration-smoke:
    name: WooCommerce 11.0.1 / ${{ matrix.storage }} storage
    needs: [php-syntax, foundation-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        storage: [legacy, hpos, hpos-sync]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install wp-env
        run: npm install --no-audit --no-fund

      - name: Start WordPress
        run: npx wp-env start

      - name: Install and activate WooCommerce 11.0.1
        run: npx wp-env run cli wp plugin install https://downloads.wordpress.org/plugin/woocommerce.11.0.1.zip --activate

      - name: Install early-translation monitor
        run: |
          npx wp-env run cli wp eval '
            wp_mkdir_p(WPMU_PLUGIN_DIR);
            @unlink(WP_CONTENT_DIR . "/wcos-early-translation.jsonl");
            $source = WP_PLUGIN_DIR . "/wc-order-splitter/tests/integration/early-translation-monitor.php";
            $target = WPMU_PLUGIN_DIR . "/wcos-early-translation-monitor.php";
            if (!copy($source, $target)) { exit(1); }
          '

      - name: Activate Order Splitter
        run: npx wp-env run cli wp plugin activate wc-order-splitter

      - name: Reject early WooCommerce translation loading
        run: |
          npx wp-env run cli wp eval '
            $log = WP_CONTENT_DIR . "/wcos-early-translation.jsonl";
            if (file_exists($log) && filesize($log) > 0) {
              fwrite(STDERR, file_get_contents($log));
              exit(1);
            }
            echo "early-translation-loading-ok\n";
          '

      - name: Configure legacy order storage
        if: matrix.storage == 'legacy'
        run: |
          npx wp-env run cli wp option update woocommerce_custom_orders_table_enabled no
          npx wp-env run cli wp option update woocommerce_custom_orders_table_data_sync_enabled no

      - name: Configure HPOS-only order storage
        if: matrix.storage == 'hpos'
        run: |
          npx wp-env run cli wp option update woocommerce_custom_orders_table_enabled yes
          npx wp-env run cli wp option update woocommerce_custom_orders_table_data_sync_enabled no

      - name: Configure HPOS compatibility mode
        if: matrix.storage == 'hpos-sync'
        run: |
          npx wp-env run cli wp option update woocommerce_custom_orders_table_enabled yes
          npx wp-env run cli wp option update woocommerce_custom_orders_table_data_sync_enabled yes

      - name: Verify plugin, storage mode, and Split-only production state
        shell: bash
        run: |
          set -euo pipefail
          npx wp-env run cli wp plugin is-active woocommerce
          npx wp-env run cli wp plugin is-active wc-order-splitter
          npx wp-env run cli wp eval '
            $expected = "${{ matrix.storage }}";
            $hpos = \Automattic\WooCommerce\Utilities\OrderUtil::custom_orders_table_usage_is_enabled();
            if (("legacy" === $expected && $hpos) || ("legacy" !== $expected && !$hpos)) { exit(1); }
            if (!WCOS_Feature_Gates::enabled(WCOS_Feature_Gates::SPLIT)) { exit(1); }
            if (!WCOS_Feature_Gates::any_enabled()) { exit(1); }
            if (!WC_Order_Splitter_Safety_Guard::mutations_enabled()) { exit(1); }
            foreach (array(
              WCOS_Feature_Gates::DUPLICATE,
              WCOS_Feature_Gates::MERGE,
              WCOS_Feature_Gates::RETURN_ORDER,
              WCOS_Feature_Gates::BULK_RETURN
            ) as $disabled_workflow) {
              if (WCOS_Feature_Gates::enabled($disabled_workflow)) { exit(1); }
            }
            foreach (array(
              "WC_ORDER_SPLITTER_MUTATIONS_ENABLED",
              "WC_ORDER_SPLITTER_SPLIT_ENABLED",
              "WC_ORDER_SPLITTER_DUPLICATE_ENABLED",
              "WC_ORDER_SPLITTER_MERGE_ENABLED",
              "WC_ORDER_SPLITTER_RETURN_ENABLED",
              "WC_ORDER_SPLITTER_BULK_RETURN_ENABLED"
            ) as $legacy_gate) {
              if (defined($legacy_gate)) { exit(1); }
            }
            if (false === has_action("wp_ajax_" . WCOS_Split_Admin_Controller::REVIEW_ACTION)) { exit(1); }
            if (false === has_action("wp_ajax_" . WCOS_Split_Admin_Controller::EXECUTE_ACTION)) { exit(1); }
            if (false === has_action("wp_ajax_" . WCOS_Duplicate_Admin_Controller::REVIEW_ACTION)) { exit(1); }
            if (false === has_action("wp_ajax_" . WCOS_Duplicate_Admin_Controller::EXECUTE_ACTION)) { exit(1); }
            $legacy_hooks = array(
              "wp_ajax_split_order",
              "wp_ajax_split_order_by_category",
              "wp_ajax_split_order_by_stock_status",
              "wp_ajax_merge_order",
              "woocommerce_order_action_yoos_duplicate_order",
              "woocommerce_order_action_yoos_return_order"
            );
            foreach ($legacy_hooks as $hook) {
              if (false !== has_action($hook)) { exit(1); }
            }
            echo "storage-and-split-production-state-ok\n";
          '

      - name: Verify mutation lease and durable journal controls
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/operation-control-smoke.php

      - name: Verify mutation leases stay bound to their operation ID
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/lease-operation-binding-smoke.php

      - name: Verify governance, authorization, and metadata policy
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/governance-smoke.php

      - name: Verify duplicate integrity, idempotency, and recovery
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/duplicate-smoke.php

      - name: Verify split conservation, idempotency, and recovery
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/split-smoke.php

      - name: Verify variation identity and historical tax conservation
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/tax-variation-smoke.php

      - name: Verify mutation side effects remain idempotent
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/side-effects-smoke.php

      - name: Verify compensating rollback and crash resume
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/compensation-smoke.php

      - name: Verify retry idempotency at every persistence boundary
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/failure-matrix-smoke.php

      - name: Verify source-save crash recovery contract
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/source-save-crash-smoke.php

      - name: Verify authoritative journal survives bounded display history
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/journal-durability-smoke.php

      - name: Reject corrupted reduced-stock source markers
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/stock-marker-validation-smoke.php

      - name: Verify real concurrent worker lease exclusion
        if: matrix.storage == 'hpos'
        shell: bash
        run: |
          set -euo pipefail
          raw="$(npx wp-env run cli wp eval '$o = wc_create_order(); $o->set_status("pending"); $o->save(); echo "WCOS_ORDER_ID=" . $o->get_id() . "\n";')"
          order_id="$(printf '%s\n' "$raw" | sed -n 's/.*WCOS_ORDER_ID=\([0-9][0-9]*\).*/\1/p' | tail -n 1)"
          test -n "$order_id"
          worker='wp-content/plugins/wc-order-splitter/tests/integration/concurrency-lock-worker.php'

          npx wp-env run cli wp eval-file "$worker" "$order_id" worker-a 4 > /tmp/wcos-worker-a.log 2>&1 &
          worker_a_pid=$!
          sleep 1
          npx wp-env run cli wp eval-file "$worker" "$order_id" worker-b 0 > /tmp/wcos-worker-b.log 2>&1
          wait "$worker_a_pid"

          cat /tmp/wcos-worker-a.log
          cat /tmp/wcos-worker-b.log
          grep -Fq 'ACQUIRED worker-a' /tmp/wcos-worker-a.log
          grep -Fq 'RELEASED worker-a' /tmp/wcos-worker-a.log
          grep -Fq 'BLOCKED worker-b' /tmp/wcos-worker-b.log

          npx wp-env run cli wp eval-file "$worker" "$order_id" worker-c 0 > /tmp/wcos-worker-c.log 2>&1
          cat /tmp/wcos-worker-c.log
          grep -Fq 'ACQUIRED worker-c' /tmp/wcos-worker-c.log
          grep -Fq 'RELEASED worker-c' /tmp/wcos-worker-c.log

          npx wp-env run cli wp eval '$o = wc_get_order('"$order_id"'); if ($o) { $o->delete(true); }'

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop

  required:
    name: Required CI
    if: always()
    needs:
      - php-syntax
      - foundation-contract
      - package-check
      - integration-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        env:
          PHP_SYNTAX_RESULT: ${{ needs['php-syntax'].result }}
          FOUNDATION_RESULT: ${{ needs['foundation-contract'].result }}
          PACKAGE_RESULT: ${{ needs['package-check'].result }}
          INTEGRATION_RESULT: ${{ needs['integration-smoke'].result }}
        run: |
          set -euo pipefail
          test "$PHP_SYNTAX_RESULT" = success
          test "$FOUNDATION_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          echo "required-ci-ok"
