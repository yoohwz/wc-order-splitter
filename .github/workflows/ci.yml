name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

      - name: Run mutation-domain unit tests
        run: php tests/unit/run.php

  integration-smoke:
    name: WordPress + WooCommerce + HPOS smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wp-env
        run: npm install --no-audit --no-fund

      - name: Start WordPress
        run: npx wp-env start

      - name: Install and activate WooCommerce
        run: npx wp-env run cli wp plugin install woocommerce --activate

      - name: Activate Order Splitter
        run: npx wp-env run cli wp plugin activate wc-order-splitter

      - name: Enable HPOS
        run: |
          npx wp-env run cli wp option update woocommerce_custom_orders_table_enabled yes
          npx wp-env run cli wp option update woocommerce_custom_orders_table_data_sync_enabled yes

      - name: Verify plugin and safety mode
        shell: bash
        run: |
          set -euo pipefail
          npx wp-env run cli wp plugin is-active woocommerce
          npx wp-env run cli wp plugin is-active wc-order-splitter
          npx wp-env run cli wp eval 'if (!defined("WC_ORDER_SPLITTER_MUTATIONS_ENABLED") || WC_ORDER_SPLITTER_MUTATIONS_ENABLED !== false) { exit(1); } echo "safety-mode-ok\n";'

      - name: Verify duplicate mutation service invariants
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/duplicate-smoke.php

      - name: Verify split conservation and idempotency
        run: npx wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/split-smoke.php

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop

  release-contract:
    name: Release safety contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject removed telemetry endpoint
        shell: bash
        run: |
          set -euo pipefail
          telemetry_host='yoexpress''.''top'
          if grep -R --line-number --fixed-strings "$telemetry_host" . --exclude-dir=.git; then
            echo 'Removed telemetry endpoint must not be present.' >&2
            exit 1
          fi

      - name: Verify mutations fail closed in 1.4.12
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "define('WC_ORDER_SPLITTER_MUTATIONS_ENABLED', false);" wc-order-splitter.php
          grep -Fq 'Stable tag: 1.4.12' readme.txt
          grep -Fq 'Version: 1.4.12' wc-order-splitter.php
