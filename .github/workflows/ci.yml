name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

  release-contract:
    name: Release safety contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject removed telemetry integration
        shell: bash
        run: |
          set -euo pipefail
          telemetry_host='yoexpress''.''top'
          test ! -e inc/cores/api/push-subscription.php
          source_files=(--include='*.php' --include='*.js' --include='*.txt')
          if grep -R --line-number --fixed-strings "$telemetry_host" "${source_files[@]}" . --exclude-dir=.git; then
            echo 'Removed telemetry endpoint must not be present in distributable source.' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'WC_Order_Splitter_Push_Subscription' --include='*.php' . --exclude-dir=.git; then
            echo 'Removed telemetry class must not be referenced by PHP source.' >&2
            exit 1
          fi

      - name: Verify mutations fail closed in 1.4.12
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "define('WC_ORDER_SPLITTER_MUTATIONS_ENABLED', false);" wc-order-splitter.php
          grep -Fq 'Stable tag: 1.4.12' readme.txt
          grep -Fq 'Version: 1.4.12' wc-order-splitter.php

  release-package:
    name: Reproducible 1.4.12 package
    needs: [php-syntax, release-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build WordPress.org ZIP
        shell: bash
        run: |
          set -euo pipefail
          package_root="build/wc-order-splitter"
          archive="build/order-splitter-for-woocommerce-1.4.12.zip"

          rm -rf build
          mkdir -p "$package_root"
          rsync -a ./ "$package_root/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.wp-env.json' \
            --exclude 'build' \
            --exclude 'node_modules' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'tests'

          test -f "$package_root/wc-order-splitter.php"
          test -f "$package_root/readme.txt"
          test ! -e "$package_root/inc/cores/api/push-subscription.php"
          grep -Fq 'Version: 1.4.12' "$package_root/wc-order-splitter.php"
          grep -Fq 'Stable tag: 1.4.12' "$package_root/readme.txt"
          grep -Fq "define('WC_ORDER_SPLITTER_MUTATIONS_ENABLED', false);" "$package_root/wc-order-splitter.php"

          (
            cd build
            find wc-order-splitter -exec touch -h -d '@0' {} +
            LC_ALL=C find wc-order-splitter -type f -print | sort | zip -X -q "$PWD/$(basename "$archive")" -@
          )

          unzip -t "$archive"
          if unzip -Z1 "$archive" | grep -E '(^|/)(\.git|\.github|tests|node_modules|build)(/|$)'; then
            echo 'Development-only files entered the release ZIP.' >&2
            exit 1
          fi
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: order-splitter-for-woocommerce-1.4.12
          path: |
            build/order-splitter-for-woocommerce-1.4.12.zip
            build/order-splitter-for-woocommerce-1.4.12.zip.sha256
          if-no-files-found: error
          retention-days: 30
