name: CI

'on':
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Path profile and fast checks
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      php: ${{ steps.profile.outputs.php }}
      storage: ${{ steps.profile.outputs.storage }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Select profile from changed paths
        id: profile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/select-ci-profile.py "$BASE_SHA" "$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=''
      - name: Fast contracts and distributable identity
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes subversion
          bash .github/scripts/run-fast.sh
      - name: Record PR traceability
        env:
          REPO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "REPO_HEAD_SHA=$REPO_HEAD_SHA"
          echo "TESTED_MERGE_SHA=$GITHUB_SHA"

  php:
    name: PHP ${{ matrix.php }}
    needs: scope
    if: needs.scope.outputs.profile != 'FAST'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.scope.outputs.php) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: bash .github/scripts/run-static.sh

  integration:
    name: Product integration / ${{ matrix.storage }}
    needs: scope
    if: needs.scope.outputs.profile != 'FAST'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        storage: ${{ fromJSON(needs.scope.outputs.storage) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Product contracts
        env:
          PROFILE: ${{ needs.scope.outputs.profile }}
          STORAGE: ${{ matrix.storage }}
        run: bash .github/scripts/run-runtime.sh "$PROFILE" "$STORAGE"

  required:
    name: Required CI
    if: always()
    needs: [scope, php, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to succeed
        env:
          PROFILE: ${{ needs.scope.outputs.profile }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          PHP_RESULT: ${{ needs.php.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$PROFILE" in
            FAST)
              test "$PHP_RESULT" = skipped
              test "$INTEGRATION_RESULT" = skipped
              ;;
            STANDARD|CRITICAL)
              test "$PHP_RESULT" = success
              test "$INTEGRATION_RESULT" = success
              ;;
            *) exit 1 ;;
          esac
          echo "Required CI passed: $PROFILE; artifacts=0"
