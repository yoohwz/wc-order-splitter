name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

  release-contract:
    name: Release safety contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject removed telemetry integration
        shell: bash
        run: |
          set -euo pipefail
          telemetry_host='yoexpress''.''top'
          test ! -e inc/cores/api/push-subscription.php
          if grep -R --line-number --fixed-strings "$telemetry_host" . --exclude-dir=.git; then
            echo 'Removed telemetry endpoint must not be present.' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'WC_Order_Splitter_Push_Subscription' . --exclude-dir=.git; then
            echo 'Removed telemetry class must not be referenced.' >&2
            exit 1
          fi

      - name: Verify mutations fail closed in 1.4.12
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "define('WC_ORDER_SPLITTER_MUTATIONS_ENABLED', false);" wc-order-splitter.php
          grep -Fq 'Stable tag: 1.4.12' readme.txt
          grep -Fq 'Version: 1.4.12' wc-order-splitter.php
