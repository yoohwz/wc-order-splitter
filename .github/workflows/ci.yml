name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/order-mutation-safety-roadmap

permissions:
  contents: read

jobs:
  unit-and-syntax:
    name: Unit & syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run unit tests
        run: composer test
      - name: Lint PHP files
        shell: bash
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse JavaScript files
        shell: bash
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  woocommerce-integration:
    name: WooCommerce smoke (HPOS ${{ matrix.hpos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hpos: ['no', 'yes']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install wp-env
        run: npm install --global @wordpress/env
      - name: Start WordPress environment
        run: wp-env start
      - name: Activate WooCommerce and Order Splitter
        run: |
          wp-env run cli wp plugin activate woocommerce
          wp-env run cli wp plugin activate wc-order-splitter
      - name: Configure HPOS
        run: wp-env run cli wp option update woocommerce_custom_orders_table_enabled ${{ matrix.hpos }}
      - name: Run order mutation smoke test
        run: wp-env run cli wp eval-file wp-content/plugins/wc-order-splitter/tests/integration/order-mutation-smoke.php
      - name: Stop WordPress environment
        if: always()
        run: wp-env stop

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wp-env
        run: npm install --global @wordpress/env
      - name: Start WordPress environment
        run: wp-env start
      - name: Activate runtime dependencies
        run: |
          wp-env run cli wp plugin activate woocommerce
          wp-env run cli wp plugin activate wc-order-splitter
          wp-env run cli wp plugin install plugin-check --activate
      - name: Run static and runtime Plugin Check
        run: wp-env run cli wp plugin check wc-order-splitter --require=wp-content/plugins/plugin-check/cli.php
      - name: Stop WordPress environment
        if: always()
        run: wp-env stop

  production-archive:
    name: Production ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build deterministic archive from Git
        run: git archive --format=zip --prefix=wc-order-splitter/ --output=wc-order-splitter-1.5.0.zip HEAD
      - name: Verify excluded development files
        shell: bash
        run: |
          ! unzip -l wc-order-splitter-1.5.0.zip | grep -E '/(tests|\.github)/|composer\.json|phpunit\.xml|\.wp-env\.json'
      - uses: actions/upload-artifact@v4
        with:
          name: wc-order-splitter-1.5.0
          path: wc-order-splitter-1.5.0.zip
          if-no-files-found: error
