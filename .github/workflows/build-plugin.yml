name: Manual package artifact

on:
  workflow_dispatch:
    inputs:
      authority:
        description: Canonical task or release authority authorizing this artifact
        required: true
        type: string

concurrency:
  group: manual-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build reproducible ZIP explicitly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout explicitly selected revision
        uses: actions/checkout@v7

      - name: Record source and declared authority
        shell: bash
        env:
          ARTIFACT_AUTHORITY: ${{ inputs.authority }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_AUTHORITY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "artifact_source_sha=$(git rev-parse HEAD)"
          echo "artifact_source_tree=$(git rev-parse HEAD^{tree})"
          echo "artifact_authority=$ARTIFACT_AUTHORITY"
          echo 'A successful artifact build does not grant release or publication authority.'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build and validate canonical distribution tree
        shell: bash
        run: .github/scripts/validate-distribution-contract.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/package/wc-order-splitter"

      - name: Build reproducible archives
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/package/wc-order-splitter"
          package_parent="$RUNNER_TEMP/package"

          touch -t 200001010000 "$package_root"
          find "$package_root" -exec touch -t 200001010000 {} +

          build_archive() {
            local output=$1
            (
              cd "$package_parent"
              find wc-order-splitter -type f -print | LC_ALL=C sort | zip -X -q "$output" -@
            )
          }

          build_archive "$GITHUB_WORKSPACE/wc-order-splitter.first.zip"
          build_archive "$GITHUB_WORKSPACE/wc-order-splitter.second.zip"
          cmp "$GITHUB_WORKSPACE/wc-order-splitter.first.zip" "$GITHUB_WORKSPACE/wc-order-splitter.second.zip"
          mv "$GITHUB_WORKSPACE/wc-order-splitter.first.zip" "$GITHUB_WORKSPACE/wc-order-splitter.zip"
          rm "$GITHUB_WORKSPACE/wc-order-splitter.second.zip"

      - name: Inspect archive integrity and exact contents
        shell: bash
        run: |
          set -euo pipefail
          package_parent="$RUNNER_TEMP/package"

          unzip -t wc-order-splitter.zip
          unzip -p wc-order-splitter.zip wc-order-splitter/wc-order-splitter.php | grep -Fq 'Plugin Name: Order Splitter for WooCommerce'

          (
            cd "$package_parent"
            find wc-order-splitter -type f -print | LC_ALL=C sort
          ) > "$RUNNER_TEMP/distribution-files.txt"
          unzip -Z1 wc-order-splitter.zip | grep -v '/$' | LC_ALL=C sort > "$RUNNER_TEMP/archive-files.txt"
          cmp "$RUNNER_TEMP/distribution-files.txt" "$RUNNER_TEMP/archive-files.txt"

          archive_version=$(unzip -p wc-order-splitter.zip wc-order-splitter/wc-order-splitter.php | sed -n 's/^ \* Version: //p' | head -n 1)
          archive_stable_tag=$(unzip -p wc-order-splitter.zip wc-order-splitter/readme.txt | sed -n 's/^Stable tag: //p' | head -n 1)
          test -n "$archive_version"
          test "$archive_version" = "$archive_stable_tag"

          sha256sum wc-order-splitter.zip > wc-order-splitter.zip.sha256
          cat wc-order-splitter.zip.sha256

      - name: Upload explicitly requested package artifact
        uses: actions/upload-artifact@v4
        with:
          name: wc-order-splitter-${{ github.sha }}
          path: |
            wc-order-splitter.zip
            wc-order-splitter.zip.sha256
          if-no-files-found: error
          retention-days: 14
