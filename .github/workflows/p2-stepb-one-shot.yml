name: P2 Step B one-shot patch

on:
  push:
    branches:
      - codex/order-splitter-p2-whole-line-runtime-v2
    paths:
      - .github/workflows/p2-stepb-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: codex/order-splitter-p2-whole-line-runtime-v2
          fetch-depth: 0

      - name: Apply reviewed prototype service patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object inc/domain/class-wcos-split-order-service.php)" = "c20bd4f868f50b55997fa536e203b9a24571cf59"
          curl --fail --location --silent --show-error \
            https://github.com/yoohwz/wc-order-splitter/pull/13.diff \
            --output /tmp/pr13.diff
          git apply --3way --include=inc/domain/class-wcos-split-order-service.php /tmp/pr13.diff

          python3 - <<'PY'
          from pathlib import Path
          path = Path('inc/domain/class-wcos-split-order-service.php')
          text = path.read_text()

          broken = "$source->update_meta_data('yoos_splitted_order', implode(',', array_values(array_unique(array_merge($legacy, $child_ids))));"
          fixed = "$source->update_meta_data('yoos_splitted_order', implode(',', array_values(array_unique(array_merge($legacy, $child_ids)))));"
          if broken not in text:
              raise SystemExit('Expected PR #13 parse defect not found')
          text = text.replace(broken, fixed, 1)

          old_sig = "public function split(WC_Order $source, array $plan, $operation_id, $execution_policy = WCOS_Split_Execution_Policy::PARTIAL_LINES_ONLY) {\n\t\t$operation_id = sanitize_key($operation_id);\n\t\t$execution_policy = WCOS_Split_Execution_Policy::normalize($execution_policy);"
          new_sig = "public function split(WC_Order $source, array $plan, $operation_id, $execution_policy = 'partial_lines_only') {\n\t\t$operation_id = sanitize_key($operation_id);\n\t\t$execution_policy = WCOS_Split_Execution_Policy::normalize($execution_policy);\n\t\tif (WCOS_Split_Execution_Policy::allows_whole_line_transfer($execution_policy)\n\t\t\t&& (!class_exists('WCOS_Stock_Side_Effect_Guard') || !WCOS_Stock_Side_Effect_Guard::has_active_scope())) {\n\t\t\tthrow new RuntimeException(__('Whole-line Split requires an active request-local stock side-effect guard.', 'wc-order-splitter'));\n\t\t}"
          if old_sig not in text:
              raise SystemExit('Expected Step B service signature not found')
          text = text.replace(old_sig, new_sig, 1)
          path.write_text(text)
          PY

          php -l inc/domain/class-wcos-split-order-service.php
          git diff --check

      - name: Commit patched service
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "YoOhw CI"
          git config user.email "actions@users.noreply.github.com"
          git add inc/domain/class-wcos-split-order-service.php
          git commit -m "P2 whole-line: add guarded runtime and recovery foundation"
          git push origin HEAD:codex/order-splitter-p2-whole-line-runtime-v2
