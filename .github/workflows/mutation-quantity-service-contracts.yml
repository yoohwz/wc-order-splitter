name: Quantity split service contracts

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  quantity-service-contracts:
    name: Request-bound service (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint service files
        shell: bash
        run: |
          set -euo pipefail
          php -l inc/mutation-v2/class-wcos-v2-quantity-split-service.php
          php -l tests/v2/quantity-split-service-contract-test.php

      - name: Run request-bound service contracts
        run: php tests/v2/quantity-split-service-contract-test.php
