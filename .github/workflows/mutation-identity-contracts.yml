name: Mutation identity contracts

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  identity-contracts:
    name: Identity contracts (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint identity files
        shell: bash
        run: |
          set -euo pipefail
          php -l inc/mutation-v2/class-wcos-v2-metadata-policy.php
          php -l inc/mutation-v2/class-wcos-v2-line-identity.php
          php -l tests/v2/identity-contract-test.php

      - name: Run identity contract tests
        run: php tests/v2/identity-contract-test.php
