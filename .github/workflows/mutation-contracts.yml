name: Mutation contracts

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  v2-contracts:
    name: V2 contracts (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint v2 mutation files
        shell: bash
        run: |
          set -euo pipefail
          php -l inc/mutation-v2/class-wcos-v2-amount-allocator.php
          php -l inc/mutation-v2/class-wcos-v2-split-plan.php
          php -l inc/mutation-v2/class-wcos-v2-operation-lock.php
          php -l inc/mutation-v2/class-wcos-v2-operation-journal.php
          php -l tests/v2/contract-test.php

      - name: Run conservation contract tests
        run: php tests/v2/contract-test.php
