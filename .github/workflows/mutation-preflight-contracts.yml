name: Mutation preflight contracts

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  preflight-contracts:
    name: Preflight contracts (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint preflight files
        shell: bash
        run: |
          set -euo pipefail
          php -l inc/mutation-v2/class-wcos-v2-order-snapshot.php
          php -l inc/mutation-v2/class-wcos-v2-split-preflight.php
          php -l tests/v2/preflight-contract-test.php

      - name: Run preflight contract tests
        run: php tests/v2/preflight-contract-test.php
